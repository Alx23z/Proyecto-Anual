<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGRESO PARA EMPLEADOS</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
     <div class="form-group">
<label for="nombre_completo">INGRESA TU NOMBRE</label>
<input type="text" id="nombre_completo" name="nombre" required>
    </div>
     <div class="form-group">
<label for="email">INGRESA TU EMAIL</label>
<input type="email" id="email" name="email" required>
    </div>
     <div class="form-group">
<label for="documentos">INGRESA TU CONTRASEÑA</label>
<input type="password" id="contraseña" name="contraseña" required>
    </div>
         <div class="form-group">
<label for="rol">INGRESA TU ROL</label>
<input type="text" id="rol" name="rol" required>
    </div>
</body>
</html>
