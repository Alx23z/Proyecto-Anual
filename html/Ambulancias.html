<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Estado de Ambulancias</title>
     <link rel="stylesheet" href="../css/ambulancias.css">

</head>

<body>



    <div class="contenido">
    <h2>Gestión de Ambulancias y Traslados</h2>

    <form action="traslado.php" method="POST">

        <label>Ambulancia:</label>
        <input type="text" name="ambulancia" required
               placeholder="Matrícula de la ambulancia">

        <label>Conductor responsable:</label>
        <input type="text" name="conductor" required
               placeholder="Nombre del conductor">

        <label>Copiloto / Acompañante:</label>
        <input type="text" name="copiloto"
               placeholder="Nombre del acompañante">

        <label>Paciente o elemento a trasladar:</label>
        <input type="text" name="paciente" required
               placeholder="Nombre del paciente o elemento">

        <label>Punto de origen:</label>
        <input type="text" name="origen" required
               placeholder="Lugar de salida">

        <label>Punto de destino:</label>
        <input type="text" name="destino" required
               placeholder="Lugar de llegada">

        <label>Hora de salida:</label>
        <input type="datetime-local" name="hora_salida" required>

        <label>Hora estimada de llegada:</label>
        <input type="datetime-local" name="hora_estimada">

        <label>Hora efectiva de llegada:</label>
        <input type="datetime-local" name="hora_llegada">

        <button type="submit">Registrar traslado</button>

    </form>
</div>
