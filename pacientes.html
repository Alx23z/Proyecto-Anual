<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>INGRESO PARA PACIENTES</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="form-group">
<label for="nombre_completo">INGRESA TU NOMBRE</label>
<input type="text" id="nombre_completo" name="nombre" required>
    </div>
     <div class="form-group">
<label for="fecha_de_nacimiento">INGRESA TU FECHA DE NACIMIENTO</label>
<input type="text" id="fecha_de_nacimiento" name="nacimiento" required>
    </div>
     <div class="form-group">
<label for="documentos">INGRESA TUS DOCUMENTOS</label>
<input type="file" id="documentos" name="documentacion" required>
    </div>
</body>
</html>
