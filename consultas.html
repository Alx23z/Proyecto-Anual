<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Consultas - S.H Clínica</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="container">
        <h1>Registro de Consulta Médica</h1>
        <form action="#" method="post">
            <div class="form-group">
                <label for="paciente">ID o Cédula del Paciente</label>
                <input type="text" id="paciente" name="paciente_id" required>
            </div>
            <div class="form-group">
                <label for="medico">Médico Asignado</label>
                <input type="text" id="medico" name="medico" required>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha y Hora</label>
                <input type="datetime-local" id="fecha" name="fecha" required>
            </div>
            <div class="form-group">
                <label for="motivo">Motivo de Consulta</label>
                <input type="text" id="motivo" name="motivo" required>
            </div>
            <input type="submit" value="Agendar Consulta">
        </form>
        <a href="principal.html" class="btn-volver">Volver al inicio</a>
    </div>
</body>
</html>
